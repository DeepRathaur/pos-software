<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e21d48",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0a0506",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Navigation -->
<header class="flex items-center justify-between p-4 max-w-md mx-auto w-full">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight">Password Reset</h2>
<div class="size-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 flex flex-col items-center justify-center p-6 max-w-md mx-auto w-full">
<!-- Icon/Illustration Placeholder -->
<div class="mb-8 p-4 rounded-2xl bg-primary/10">
<span class="material-symbols-outlined text-primary text-5xl">mark_email_read</span>
</div>
<div class="text-center mb-10">
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-bold leading-tight mb-3">Check your email</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed">
                We've sent a 6-digit verification code to your email.
            </p>
</div>
<!-- OTP Input Section -->
<div class="w-full mb-10">
<div class="flex justify-between gap-2 sm:gap-3">
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg border-2 border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:border-primary dark:focus:border-primary focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg border-2 border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:border-primary dark:focus:border-primary focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg border-2 border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:border-primary dark:focus:border-primary focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg border-2 border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:border-primary dark:focus:border-primary focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg border-2 border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:border-primary dark:focus:border-primary focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-lg border-2 border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:border-primary dark:focus:border-primary focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="number"/>
</div>
</div>
<!-- Actions -->
<div class="w-full space-y-6">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] text-lg">
                Verify Code
            </button>
<div class="text-center">
<p class="text-slate-600 dark:text-slate-400 font-medium">
                    Didn't receive code? 
                    <button class="text-primary hover:underline font-bold ml-1">Resend</button>
</p>
</div>
</div>
</main>
<!-- Decorative Background Elements -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
</body></html>
