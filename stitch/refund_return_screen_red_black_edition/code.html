<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e21d48",
                        "background-light": "#f8f6f6",
                        "background-dark": "#12080a",
                        "surface-dark": "#1c0d10",
                        "border-dark": "#3d1a21"
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3d1a21;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
<div class="flex items-center justify-between p-4">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-primary/10 transition-colors text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Process Return</h1>
<div class="size-10"></div> <!-- Spacer for symmetry -->
</div>
</header>
<main class="flex-1 w-full max-w-md mx-auto p-4 space-y-6 pb-32">
<!-- Order Header Info -->
<section class="bg-surface-dark rounded-xl p-4 border border-border-dark">
<div class="flex flex-col gap-1 mb-4">
<span class="text-xs font-bold uppercase tracking-widest text-primary/70">Order Reference</span>
<div class="flex justify-between items-center">
<h2 class="text-xl font-bold">#8291</h2>
<span class="text-sm text-slate-400">Oct 24, 2023</span>
</div>
</div>
<div class="flex items-center gap-2 text-sm text-slate-400">
<span class="material-symbols-outlined text-sm">person</span>
<span>Customer: James Wilson</span>
</div>
</section>
<!-- Item Selection -->
<section class="space-y-3">
<div class="flex justify-between items-end">
<h3 class="text-sm font-bold uppercase tracking-widest text-primary/70">Select Items to Return</h3>
<button class="text-xs font-medium text-primary hover:underline">Select All</button>
</div>
<div class="space-y-3">
<!-- Item Card 1 -->
<label class="flex items-center gap-4 bg-surface-dark p-4 rounded-xl border border-border-dark cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex items-center justify-center">
<input checked="" class="h-6 w-6 rounded border-border-dark bg-transparent text-primary focus:ring-primary focus:ring-offset-0 focus:outline-none" type="checkbox"/>
</div>
<div class="flex-1">
<p class="font-semibold text-slate-100">Premium Steak &amp; Greens</p>
<p class="text-sm text-slate-400">1 unit • $42.00</p>
</div>
<div class="text-right">
<p class="font-bold text-slate-100">$42.00</p>
</div>
</label>
<!-- Item Card 2 -->
<label class="flex items-center gap-4 bg-surface-dark p-4 rounded-xl border border-border-dark cursor-pointer active:scale-[0.98] transition-transform">
<div class="flex items-center justify-center">
<input class="h-6 w-6 rounded border-border-dark bg-transparent text-primary focus:ring-primary focus:ring-offset-0 focus:outline-none" type="checkbox"/>
</div>
<div class="flex-1">
<p class="font-semibold text-slate-100">Truffle Potato Mash</p>
<p class="text-sm text-slate-400">1 unit • $12.50</p>
</div>
<div class="text-right">
<p class="font-bold text-slate-100">$12.50</p>
</div>
</label>
</div>
</section>
<!-- Return Reason -->
<section class="space-y-3">
<h3 class="text-sm font-bold uppercase tracking-widest text-primary/70">Return Reason</h3>
<div class="relative">
<select class="w-full bg-surface-dark border-border-dark text-slate-100 rounded-xl p-4 appearance-none focus:ring-primary focus:border-primary transition-all pr-10">
<option disabled="" selected="" value="">Select a reason...</option>
<option value="damaged">Damaged during delivery</option>
<option value="incorrect">Incorrect item received</option>
<option value="quality">Poor food quality</option>
<option value="choice">Customer choice / Changed mind</option>
</select>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</section>
<!-- Refund Summary -->
<section class="bg-surface-dark rounded-xl p-5 border border-border-dark space-y-3">
<div class="flex justify-between text-sm text-slate-400">
<span>Subtotal Refund</span>
<span>$42.00</span>
</div>
<div class="flex justify-between text-sm text-slate-400">
<span>Tax Refund (8%)</span>
<span>$3.36</span>
</div>
<div class="pt-3 border-t border-border-dark flex justify-between items-center">
<span class="text-base font-bold text-slate-100">Total Refund</span>
<span class="text-2xl font-black text-primary">$45.36</span>
</div>
</section>
</main>
<!-- Fixed Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 right-0 p-4 bg-background-dark/90 backdrop-blur-xl border-t border-border-dark">
<div class="max-w-md mx-auto space-y-3">
<div class="flex items-center gap-2 px-1 mb-2">
<input class="rounded border-border-dark bg-transparent text-primary focus:ring-primary h-4 w-4" id="restock" type="checkbox"/>
<label class="text-xs text-slate-400" for="restock">Restock items back to inventory</label>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">restart_alt</span>
                Confirm Refund
            </button>
</div>
</footer>
</body></html>
