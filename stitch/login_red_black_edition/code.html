<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>POS Premium - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e21d48",
                        "background-light": "#f8f6f6",
                        "background-dark": "#12080a",
                        "surface-dark": "#211115",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-effect {
            background: rgba(33, 17, 21, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 29, 72, 0.1);
        }
        .glow-soft {
            box-shadow: 0 0 40px -10px rgba(226, 29, 72, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden items-center justify-center p-4">
<!-- Background Decorative Elements -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-primary/5 blur-[100px] rounded-full"></div>
<div class="w-full max-w-[440px] z-10">
<!-- Header/Logo Section -->
<div class="flex flex-col items-center mb-8">
<div class="bg-primary/10 p-3 rounded-2xl mb-4 border border-primary/20">
<span class="material-symbols-outlined text-primary text-4xl leading-none">point_of_sale</span>
</div>
<h2 class="text-slate-900 dark:text-white text-2xl font-bold tracking-tight">POS Premium</h2>
<p class="text-slate-500 dark:text-slate-400 mt-2">Manage your business from anywhere</p>
</div>
<!-- Login Card -->
<div class="glass-effect glow-soft rounded-2xl p-8 shadow-2xl">
<div class="mb-6">
<h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-1">Welcome Back</h1>
<p class="text-sm text-slate-500 dark:text-slate-400">Please enter your details to sign in.</p>
</div>
<form class="space-y-5">
<!-- Email/Phone Input -->
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-200 ml-1">Email or Phone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full bg-slate-100 dark:bg-background-dark/50 border border-slate-200 dark:border-primary/20 rounded-xl py-3.5 pl-12 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none" placeholder="name@company.com" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="text-sm font-medium text-slate-700 dark:text-slate-200">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full bg-slate-100 dark:bg-background-dark/50 border border-slate-200 dark:border-primary/20 rounded-xl py-3.5 pl-12 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all outline-none" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-2 px-1">
<input class="w-4 h-4 rounded border-slate-300 dark:border-primary/30 text-primary focus:ring-primary bg-transparent" id="remember" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-400" for="remember">Keep me logged in</label>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-primary/10"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-background-light dark:bg-surface-dark px-2 text-slate-500">Quick Access</span>
</div>
</div>
<!-- Secondary Auth Options -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2.5 border border-slate-200 dark:border-primary/20 rounded-lg hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors">
<span class="material-symbols-outlined text-lg">fingerprint</span>
<span class="text-sm font-medium">Biometric</span>
</button>
<button class="flex items-center justify-center gap-2 py-2.5 border border-slate-200 dark:border-primary/20 rounded-lg hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors">
<span class="material-symbols-outlined text-lg">qr_code_scanner</span>
<span class="text-sm font-medium">QR Code</span>
</button>
</div>
</div>
<!-- Footer CTA -->
<div class="mt-8 text-center">
<p class="text-slate-500 dark:text-slate-400">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Register Business</a>
</p>
</div>
</div>
<!-- System Status Bar (Bottom) -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-6 text-[10px] text-slate-500 uppercase tracking-widest font-medium opacity-50">
<span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> System Online</span>
<span>v4.2.0-stable</span>
<span>© 2025 POS Premium Inc.</span>
</div>
</div>
</body></html>
